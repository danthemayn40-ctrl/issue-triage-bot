name: Issue Triage Example

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run Issue Triage Bot
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config-path: '.github/issue-triage.yml'
